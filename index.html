<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Team Renfo - Planning</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C41C68">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Team Renfo">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700;800&display=swap');

:root {
  --bg: #121213;
  --card: #1D1D1F;
  --card-alt: #29292B;
  --pink: #C41C68;
  --lime: #D6FF3D;
  --cream: #F5F3EE;
  --muted: #8F8F96;
  --border: rgba(245,243,238,0.09);
}

#ps-root {
  background: var(--bg);
  color: var(--cream);
  font-family: 'Manrope', system-ui, sans-serif;
  min-height: 100vh;
  padding: 0 0 40px 0;
  border-radius: 0;
  overflow: hidden;
  position: relative;
}

#ps-root * { box-sizing: border-box; }

.ps-hero {
  background: linear-gradient(135deg, var(--pink) 0%, #500E2E 100%);
  padding: 32px 22px 26px 22px;
  position: relative;
  overflow: hidden;
}
.ps-hero::after {
  content: "";
  position: absolute;
  right: -40px; top: -40px;
  width: 160px; height: 160px;
  background: var(--lime);
  border-radius: 50%;
  opacity: 0.22;
}
.ps-eyebrow {
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--cream);
  opacity: 0.85;
  margin: 0 0 6px 0;
}
.ps-title {
  font-family: 'Anton', 'Manrope', sans-serif;
  font-size: 40px;
  line-height: 0.95;
  margin: 0;
  color: var(--cream);
  text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
}
.ps-title .accent { color: var(--lime); }
.ps-sub {
  font-size: 14px;
  color: var(--cream);
  opacity: 0.9;
  margin-top: 10px;
  max-width: 320px;
  line-height: 1.4;
}

.ps-body { padding: 20px 16px 0 16px; }

.ps-section-label {
  font-weight: 800;
  font-size: 14px;
  color: var(--muted);
  margin: 22px 0 12px 2px;
}

.ps-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 0;
  margin-bottom: 16px;
  overflow: hidden;
  position: relative;
}
.ps-card-past {
  opacity: 0.5;
  filter: grayscale(0.6);
}
.ps-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 16px 16px 0 16px;
}
.ps-card-type {
  font-family: 'Anton', sans-serif;
  font-size: 22px;
  color: var(--cream);
  line-height: 1;
  letter-spacing: 0.01em;
}
.ps-duree-badge {
  background: var(--lime);
  color: #1A0E17;
  font-weight: 800;
  font-size: 13px;
  padding: 6px 10px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-left: 10px;
}
.ps-when {
  font-weight: 700;
  font-size: 13.5px;
  color: var(--pink);
  margin-top: 6px;
  padding: 0 16px;
  text-transform: capitalize;
}
.ps-desc {
  font-size: 13.5px;
  color: var(--cream);
  opacity: 0.9;
  line-height: 1.5;
  padding: 10px 16px 0 16px;
}
.ps-materiel {
  font-size: 12.5px;
  color: var(--muted);
  padding: 6px 16px 0 16px;
}
.ps-materiel b { color: var(--cream); opacity: 0.8; }

.ps-participants {
  padding: 14px 16px 4px 16px;
  border-top: 1px dashed var(--border);
  margin-top: 14px;
}
.ps-count {
  font-weight: 800;
  font-size: 15px;
  color: var(--lime);
  margin-bottom: 8px;
}
.ps-names {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.ps-name-chip {
  background: var(--card-alt);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 10px 5px 12px;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ps-name-chip button {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}
.ps-empty-note {
  font-size: 12.5px;
  color: var(--muted);
  font-style: italic;
  margin-bottom: 12px;
}

.ps-actions {
  display: flex;
  gap: 8px;
  padding: 0 16px 16px 16px;
  flex-wrap: wrap;
}
.ps-btn {
  border: none;
  border-radius: 10px;
  font-weight: 800;
  font-size: 13px;
  padding: 11px 14px;
  cursor: pointer;
  font-family: inherit;
}
.ps-btn-primary {
  background: var(--pink);
  color: var(--cream);
  flex: 1;
  min-width: 130px;
}
.ps-btn-ghost {
  background: transparent;
  color: var(--cream);
  border: 1px solid var(--border);
}
.ps-btn-visio {
  background: var(--card-alt);
  color: var(--lime);
  border: 1px solid rgba(200,255,61,0.3);
}

.ps-admin-zone {
  margin-top: 30px;
  padding: 16px;
  border-top: 1px solid var(--border);
}
.ps-btn-admin {
  width: 100%;
  background: var(--card-alt);
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 12px;
  padding: 13px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}

@media (hover: hover) and (pointer: fine) {
  .ps-name-chip button:hover { color: var(--pink); }
  .ps-btn-primary:hover { background: #E01F68; }
  .ps-btn-ghost:hover { border-color: var(--lime); color: var(--lime); }
  .ps-btn-admin:hover { color: var(--cream); border-color: var(--muted); }
}

.ps-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 999;
}
.ps-modal {
  background: var(--card);
  border-radius: 20px;
  padding: 22px 18px 26px 18px;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  border-top: 3px solid var(--pink);
}
.ps-modal h3 {
  font-family: 'Anton', sans-serif;
  font-size: 22px;
  margin: 0 0 16px 0;
  color: var(--cream);
}
.ps-field { margin-bottom: 14px; }
.ps-field label {
  display: block;
  font-size: 12.5px;
  font-weight: 800;
  color: var(--muted);
  margin-bottom: 6px;
}
.ps-field input, .ps-field textarea {
  width: 100%;
  background: var(--card-alt);
  border: 1px solid var(--border);
  color: var(--cream);
  border-radius: 10px;
  padding: 11px 12px;
  font-size: 14px;
  font-family: inherit;
}
.ps-field input:focus, .ps-field textarea:focus {
  outline: none;
  border-color: var(--pink);
}
.ps-row2 { display: flex; gap: 10px; }
.ps-row2 > div { flex: 1; }
.ps-modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.ps-loading, .ps-empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 14px;
}

.ps-view-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}
.ps-view-btn {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  font-weight: 800;
  font-size: 13px;
  padding: 11px;
  border-radius: 10px;
  cursor: pointer;
  font-family: inherit;
}
.ps-view-btn.active {
  background: var(--pink);
  color: var(--cream);
  border-color: var(--pink);
}

.ps-admin-status {
  text-align: center;
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 10px;
}
.ps-admin-status a { color: var(--lime); text-decoration: underline; }

.ps-cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.ps-cal-title {
  font-family: 'Anton', sans-serif;
  font-size: 19px;
  text-transform: capitalize;
}
.ps-cal-nav-btn {
  background: var(--card-alt);
  border: 1px solid var(--border);
  color: var(--cream);
  border-radius: 8px;
  padding: 6px 14px;
  cursor: pointer;
  font-weight: 800;
  font-size: 16px;
}
.ps-cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}
.ps-cal-weekday {
  text-align: center;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--muted);
  padding: 4px 0 8px 0;
}
.ps-cal-cell {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-height: 58px;
  padding: 4px 3px;
  overflow: hidden;
}
.ps-cal-cell.empty { background: transparent; border: none; }
.ps-cal-cell.today { border-color: var(--pink); border-width: 2px; }
.ps-cal-daynum {
  font-weight: 800;
  color: var(--muted);
  font-size: 10.5px;
  margin-bottom: 3px;
}
.ps-cal-chip {
  background: var(--card-alt);
  color: var(--lime);
  border-radius: 5px;
  padding: 2px 4px;
  font-size: 9px;
  margin-bottom: 2px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--cream);
  font-family: 'Manrope', system-ui, sans-serif;
}
</style>
</head>
<body>

<div id="ps-root">
  <div class="ps-hero">
    <p class="ps-eyebrow">TEAM RENFO • ENTRE COPINES</p>
    <h1 class="ps-title">ON SE BOUGE<br/><span class="accent">ENSEMBLE.</span></h1>
    <p class="ps-sub">Choisis ta séance, inscris-toi. Zéro excuse, que du fun 💪</p>
  </div>
  <div class="ps-body" id="ps-body">
    <div class="ps-loading">Chargement du planning…</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
(function() {
  const firebaseConfig = {
    apiKey: "AIzaSyDoZbQjv6JL3ct_Gc2Uk3iVmxjFpUVJVvQ",
    authDomain: "sport-entre-copines.firebaseapp.com",
    databaseURL: "https://sport-entre-copines-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "sport-entre-copines",
    storageBucket: "sport-entre-copines.firebasestorage.app",
    messagingSenderId: "940441266071",
    appId: "1:940441266071:web:2111cdf0b96e96a28146d2"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const JOURS_COURT = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  const ADMIN_KEY = 'ps-admin-token';
  let sessions = [];
  let adminPin = null;
  let currentView = 'list';
  let calendarMonth = new Date();
  calendarMonth.setDate(1);
  const body = document.getElementById('ps-body');

  function isAdminLoggedIn() {
    try { return localStorage.getItem(ADMIN_KEY) === 'yes'; } catch(e) { return false; }
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  function customPrompt(title, opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'ps-modal-overlay';
      overlay.innerHTML = `
        <div class="ps-modal">
          <h3>${escapeHtml(title)}</h3>
          <div class="ps-field">
            <input id="ps-prompt-input" type="${opts.type || 'text'}" placeholder="${escapeHtml(opts.placeholder || '')}" />
          </div>
          <div class="ps-modal-actions">
            <button class="ps-btn ps-btn-ghost" id="ps-prompt-cancel" style="flex:1">Annuler</button>
            <button class="ps-btn ps-btn-primary" id="ps-prompt-ok" style="flex:1">Valider</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const input = overlay.querySelector('#ps-prompt-input');
      setTimeout(() => input.focus(), 60);
      function cleanup(val) { overlay.remove(); resolve(val); }
      overlay.querySelector('#ps-prompt-cancel').onclick = () => cleanup(null);
      overlay.querySelector('#ps-prompt-ok').onclick = () => cleanup(input.value.trim() || null);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') cleanup(input.value.trim() || null); });
      overlay.onclick = (e) => { if (e.target === overlay) cleanup(null); };
    });
  }

  function customConfirm(message) {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'ps-modal-overlay';
      overlay.innerHTML = `
        <div class="ps-modal">
          <h3>Confirmation</h3>
          <p style="font-size:14px; color:var(--cream); opacity:0.9; margin-bottom:18px;">${escapeHtml(message)}</p>
          <div class="ps-modal-actions">
            <button class="ps-btn ps-btn-ghost" id="ps-confirm-no" style="flex:1">Annuler</button>
            <button class="ps-btn ps-btn-primary" id="ps-confirm-yes" style="flex:1">Confirmer</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#ps-confirm-no').onclick = () => { overlay.remove(); resolve(false); };
      overlay.querySelector('#ps-confirm-yes').onclick = () => { overlay.remove(); resolve(true); };
      overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(false); } };
    });
  }

  function customAlert(message) {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'ps-modal-overlay';
      overlay.innerHTML = `
        <div class="ps-modal">
          <p style="font-size:14px; color:var(--cream); margin-bottom:18px;">${escapeHtml(message)}</p>
          <div class="ps-modal-actions">
            <button class="ps-btn ps-btn-primary" id="ps-alert-ok" style="flex:1">OK</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#ps-alert-ok').onclick = () => { overlay.remove(); resolve(); };
      overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(); } };
    });
  }

  function fmtDate(dateStr) {
    try {
      const d = new Date(dateStr + 'T00:00:00');
      const jour = JOURS[d.getDay()];
      const jj = String(d.getDate()).padStart(2,'0');
      const mm = String(d.getMonth()+1).padStart(2,'0');
      return jour + ' ' + jj + '/' + mm;
    } catch(e) { return dateStr; }
  }

  function sortSessions(arr) {
    return arr.slice().sort((a,b) => (a.date+a.heure).localeCompare(b.date+b.heure));
  }

  function sessionEnd(s) {
    const start = new Date(s.date + 'T' + s.heure + ':00');
    return new Date(start.getTime() + (parseInt(s.duree, 10) || 0) * 60000);
  }

  function isSessionPast(s) {
    return sessionEnd(s).getTime() <= Date.now();
  }

  function initSessionsListener() {
    db.ref('sessions').on('value', (snapshot) => {
      const val = snapshot.val() || {};
      sessions = Object.keys(val).map(id => ({ id, ...val[id], participants: val[id].participants || [] }));
      render();
    }, (error) => {
      body.innerHTML = '<div class="ps-empty-state">Impossible de charger le planning (connexion). Vérifie ta connexion internet et recharge la page.</div>';
    });
  }

  async function checkOrSetPin(promptMsg) {
    if (isAdminLoggedIn()) return true;
    try {
      const snap = await db.ref('adminPin').once('value');
      adminPin = snap.exists() ? snap.val() : null;
    } catch (e) {
      adminPin = null;
    }
    if (!adminPin) {
      const newPin = await customPrompt("Choisis ton code secret", {placeholder: "4 chiffres minimum"});
      if (!newPin || newPin.length < 4) return false;
      adminPin = newPin;
      try { await db.ref('adminPin').set(newPin); } catch(e) {}
      try { localStorage.setItem(ADMIN_KEY, 'yes'); } catch(e) {}
      return true;
    }
    const entered = await customPrompt(promptMsg, {placeholder: "Code secret"});
    if (entered === adminPin) {
      try { localStorage.setItem(ADMIN_KEY, 'yes'); } catch(e) {}
      return true;
    }
    return false;
  }

  window.psAdminLogout = async function() {
    const ok = await customConfirm("Se déconnecter du mode organisatrice sur cet appareil ?");
    if (!ok) return;
    try { localStorage.removeItem(ADMIN_KEY); } catch(e) {}
    render();
  };

  function genId() {
    return 's' + Date.now() + Math.random().toString(36).slice(2,7);
  }

  function makeICS(session) {
    const start = new Date(session.date + 'T' + session.heure + ':00');
    const end = new Date(start.getTime() + (parseInt(session.duree,10) || 30) * 60000);
    function fmt(d) {
      return d.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
    }
    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'BEGIN:VEVENT',
      'UID:' + session.id + '@planning-sport',
      'DTSTAMP:' + fmt(new Date()),
      'DTSTART:' + fmt(start),
      'DTEND:' + fmt(end),
      'SUMMARY:' + session.type,
      'DESCRIPTION:' + (session.description || '').replace(/\n/g,'\\n'),
      'BEGIN:VALARM',
      'TRIGGER:-PT20M',
      'ACTION:DISPLAY',
      'DESCRIPTION:Séance dans 20 minutes !',
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');
    const blob = new Blob([ics], {type: 'text/calendar'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = session.type.replace(/[^a-z0-9]/gi,'_') + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  window.psRegister = async function(sessionId) {
    const name = await customPrompt("Ton prénom pour t'inscrire", {placeholder: "Ton prénom"});
    if (!name) return;
    const s = sessions.find(x => x.id === sessionId);
    if (!s) return;
    const participants = s.participants || [];
    if (participants.some(p => p.toLowerCase() === name.toLowerCase())) {
      await customAlert("Tu es déjà inscrite à cette séance !");
      return;
    }
    try {
      await db.ref('sessions/' + sessionId + '/participants').set([...participants, name]);
    } catch (e) {
      await customAlert("Oups, l'inscription a échoué. Vérifie ta connexion et réessaie.");
    }
  };

  window.psUnregisterAt = async function(sessionId, index) {
    const s = sessions.find(x => x.id === sessionId);
    if (!s || !s.participants || !s.participants[index]) return;
    const name = s.participants[index];
    const ok = await customConfirm(`${name} se désinscrit de cette séance ?`);
    if (!ok) return;
    const updated = s.participants.slice();
    updated.splice(index, 1);
    try {
      await db.ref('sessions/' + sessionId + '/participants').set(updated);
    } catch (e) {
      await customAlert("Oups, la désinscription a échoué. Vérifie ta connexion et réessaie.");
    }
  };

  window.psDownloadICS = function(sessionId) {
    const s = sessions.find(x => x.id === sessionId);
    if (s) makeICS(s);
  };

  window.psDeleteSession = async function(sessionId) {
    const ok = await checkOrSetPin("Code organisatrice pour supprimer ce créneau");
    if (!ok) { await customAlert("Code incorrect."); return; }
    const confirmed = await customConfirm("Supprimer définitivement ce créneau ?");
    if (!confirmed) return;
    try {
      await db.ref('sessions/' + sessionId).remove();
    } catch (e) {
      await customAlert("Oups, la suppression a échoué. Vérifie ta connexion et réessaie.");
    }
  };

  window.psOpenAddModal = async function() {
    const ok = await checkOrSetPin("Code organisatrice pour ajouter un créneau");
    if (!ok) { await customAlert("Code incorrect."); return; }
    showSessionModal(null);
  };

  window.psOpenEditModal = async function(sessionId) {
    const ok = await checkOrSetPin("Code organisatrice pour modifier ce créneau");
    if (!ok) { await customAlert("Code incorrect."); return; }
    const s = sessions.find(x => x.id === sessionId);
    if (!s) return;
    showSessionModal(s);
  };

  function showSessionModal(existing) {
    const isEdit = !!existing;
    const overlay = document.createElement('div');
    overlay.className = 'ps-modal-overlay';
    overlay.innerHTML = `
      <div class="ps-modal">
        <h3>${isEdit ? 'Modifier le créneau ✏️' : 'Nouveau créneau ✨'}</h3>
        <div class="ps-field">
          <label>Type de séance</label>
          <input id="ps-f-type" placeholder="Ex : Abdos fessiers, Full body, Cardio..." />
        </div>
        <div class="ps-row2">
          <div class="ps-field">
            <label>Date</label>
            <input id="ps-f-date" type="date" />
          </div>
          <div class="ps-field">
            <label>Heure</label>
            <input id="ps-f-heure" type="time" />
          </div>
        </div>
        <div class="ps-field">
          <label>Durée (minutes)</label>
          <input id="ps-f-duree" type="number" placeholder="30" />
        </div>
        <div class="ps-field">
          <label>Description courte</label>
          <textarea id="ps-f-desc" rows="2" placeholder="Ex : Séance intense spécial bras, vidéo YouTube fournie"></textarea>
        </div>
        <div class="ps-field">
          <label>Matériel (optionnel)</label>
          <input id="ps-f-materiel" placeholder="Ex : tapis, haltères légers" />
        </div>
        <div class="ps-field">
          <label>Lien visio (optionnel)</label>
          <input id="ps-f-lien" placeholder="Lien Zoom / Meet / FaceTime..." />
        </div>
        <div class="ps-modal-actions">
          <button class="ps-btn ps-btn-ghost" id="ps-cancel" style="flex:1">Annuler</button>
          <button class="ps-btn ps-btn-primary" id="ps-confirm" style="flex:1">${isEdit ? 'Enregistrer' : 'Créer le créneau'}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    if (isEdit) {
      overlay.querySelector('#ps-f-type').value = existing.type || '';
      overlay.querySelector('#ps-f-date').value = existing.date || '';
      overlay.querySelector('#ps-f-heure').value = existing.heure || '';
      overlay.querySelector('#ps-f-duree').value = existing.duree || '';
      overlay.querySelector('#ps-f-desc').value = existing.description || '';
      overlay.querySelector('#ps-f-materiel').value = existing.materiel || '';
      overlay.querySelector('#ps-f-lien').value = existing.lienVisio || '';
    }

    document.getElementById('ps-cancel').onclick = () => overlay.remove();
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    document.getElementById('ps-confirm').onclick = async () => {
      const type = document.getElementById('ps-f-type').value.trim();
      const date = document.getElementById('ps-f-date').value;
      const heure = document.getElementById('ps-f-heure').value;
      const duree = document.getElementById('ps-f-duree').value || '30';
      const description = document.getElementById('ps-f-desc').value.trim();
      const materiel = document.getElementById('ps-f-materiel').value.trim();
      const lienVisio = document.getElementById('ps-f-lien').value.trim();
      if (!type || !date || !heure) {
        await customAlert("Merci de remplir au minimum le type, la date et l'heure.");
        return;
      }
      const id = isEdit ? existing.id : genId();
      try {
        if (isEdit) {
          await db.ref('sessions/' + id).update({ type, date, heure, duree, description, materiel, lienVisio });
        } else {
          await db.ref('sessions/' + id).set({ type, date, heure, duree, description, materiel, lienVisio, participants: [] });
        }
        overlay.remove();
      } catch (e) {
        await customAlert(isEdit ? "Oups, la modification a échoué. Vérifie ta connexion et réessaie." : "Oups, la création a échoué. Vérifie ta connexion et réessaie.");
      }
    };
  }

  function sessionCard(s) {
    const isPast = isSessionPast(s);
    const participants = s.participants || [];
    const namesHtml = participants.length
      ? '<div class="ps-names">' + participants.map((n, i) =>
          `<span class="ps-name-chip">${escapeHtml(n)} ${isPast ? '' : `<button onclick="psUnregisterAt('${s.id}', ${i})">✕</button>`}</span>`
        ).join('') + '</div>'
      : '<p class="ps-empty-note">Personne inscrite pour l’instant — sois la première !</p>';

    const activeActions = `
      <button class="ps-btn ps-btn-primary" onclick="psRegister('${s.id}')">Je m'inscris</button>
      <button class="ps-btn ps-btn-ghost" onclick="psDownloadICS('${s.id}')">+ Rappel calendrier</button>
      ${s.lienVisio ? `<button class="ps-btn ps-btn-visio" onclick="window.open('${escapeHtml(s.lienVisio)}','_blank')">Rejoindre la visio</button>` : ''}
    `;
    const pastNote = `<p class="ps-empty-note" style="margin-bottom:0;">Séance terminée</p>`;

    return `
      <div class="ps-card ${isPast ? 'ps-card-past' : ''}">
        <div class="ps-card-top">
          <div class="ps-card-type">${escapeHtml(s.type)}</div>
          <div class="ps-duree-badge">${escapeHtml(String(s.duree))} min</div>
        </div>
        <div class="ps-when">${fmtDate(s.date)} · ${escapeHtml(s.heure)}</div>
        ${s.description ? `<div class="ps-desc">${escapeHtml(s.description)}</div>` : ''}
        ${s.materiel ? `<div class="ps-materiel"><b>Matériel :</b> ${escapeHtml(s.materiel)}</div>` : ''}
        <div class="ps-participants">
          <div class="ps-count">${participants.length} inscrite${participants.length > 1 ? 's' : ''}</div>
          ${namesHtml}
        </div>
        <div class="ps-actions">
          ${isPast ? pastNote : activeActions}
          <button class="ps-btn ps-btn-ghost" onclick="psOpenEditModal('${s.id}')" style="flex:0 0 auto;">✏️</button>
          <button class="ps-btn ps-btn-ghost" onclick="psDeleteSession('${s.id}')" style="flex:0 0 auto;">🗑</button>
        </div>
      </div>
    `;
  }

  function adminZoneHtml() {
    const loggedIn = isAdminLoggedIn();
    return `
      <div class="ps-admin-zone">
        <button class="ps-btn-admin" onclick="psOpenAddModal()">+ Ajouter un créneau (organisatrice)</button>
        ${loggedIn ? '<div class="ps-admin-status">✓ Organisatrice connectée sur cet appareil · <a href="#" onclick="psAdminLogout();return false;">se déconnecter</a></div>' : ''}
      </div>
    `;
  }

  function renderListView() {
    const sorted = sortSessions(sessions);
    const upcoming = sorted.filter(s => !isSessionPast(s));
    const past = sorted.filter(s => isSessionPast(s));

    let html = '';
    if (upcoming.length === 0) {
      html += '<div class="ps-empty-state">Aucune séance prévue pour l’instant. L’organisatrice peut en ajouter une juste en dessous 👇</div>';
    } else {
      html += '<div class="ps-section-label">PROCHAINES SÉANCES</div>';
      html += upcoming.map(sessionCard).join('');
    }
    html += adminZoneHtml();
    if (past.length > 0) {
      html += '<div class="ps-section-label" style="opacity:0.6">Séances passées</div>';
      html += past.map(sessionCard).join('');
    }
    return html;
  }

  function renderCalendarView() {
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    const monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    const firstOfMonth = new Date(year, month, 1);
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    let startWeekday = firstOfMonth.getDay() - 1;
    if (startWeekday < 0) startWeekday = 6;
    const todayStr = new Date().toISOString().slice(0,10);

    const byDate = {};
    sessions.forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });

    let cells = '';
    for (let i = 0; i < startWeekday; i++) {
      cells += '<div class="ps-cal-cell empty"></div>';
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      const daySessions = (byDate[dateStr] || []).sort((a,b) => a.heure.localeCompare(b.heure));
      const chips = daySessions.map(s =>
        `<div class="ps-cal-chip" onclick="psShowSessionDetail('${s.id}')">${escapeHtml(s.heure)} ${escapeHtml(s.type)}</div>`
      ).join('');
      cells += `<div class="ps-cal-cell ${dateStr === todayStr ? 'today' : ''}">
        <div class="ps-cal-daynum">${d}</div>
        ${chips}
      </div>`;
    }

    const weekdaysHtml = JOURS_COURT.map(j => `<div class="ps-cal-weekday">${j}</div>`).join('');

    return `
      <div class="ps-cal-header">
        <button class="ps-cal-nav-btn" onclick="psCalendarNav(-1)">‹</button>
        <div class="ps-cal-title">${monthNames[month]} ${year}</div>
        <button class="ps-cal-nav-btn" onclick="psCalendarNav(1)">›</button>
      </div>
      <div class="ps-cal-grid">
        ${weekdaysHtml}
        ${cells}
      </div>
      ${adminZoneHtml()}
    `;
  }

  window.psSetView = function(view) {
    currentView = view;
    render();
  };

  window.psCalendarNav = function(delta) {
    calendarMonth.setMonth(calendarMonth.getMonth() + delta);
    render();
  };

  window.psShowSessionDetail = function(sessionId) {
    const s = sessions.find(x => x.id === sessionId);
    if (!s) return;
    const overlay = document.createElement('div');
    overlay.className = 'ps-modal-overlay';
    overlay.innerHTML = `<div class="ps-modal" style="padding:0; overflow:visible; max-height:88vh; overflow-y:auto;">
      ${sessionCard(s)}
      <div style="padding:0 16px 16px 16px;">
        <button class="ps-btn ps-btn-ghost" style="width:100%" onclick="this.closest('.ps-modal-overlay').remove()">Fermer</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  };

  function render() {
    const toggleHtml = `
      <div class="ps-view-toggle">
        <button class="ps-view-btn ${currentView === 'list' ? 'active' : ''}" onclick="psSetView('list')">📋 Liste</button>
        <button class="ps-view-btn ${currentView === 'calendar' ? 'active' : ''}" onclick="psSetView('calendar')">📅 Calendrier</button>
      </div>
    `;
    body.innerHTML = toggleHtml + (currentView === 'calendar' ? renderCalendarView() : renderListView());
  }

  initSessionsListener();
  setInterval(render, 60000);
})();
</script>

</body>
</html>
